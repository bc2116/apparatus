# Apparatus preferences — usable immediately, with no setup questionnaire.
# Ask your assistant to change a preference whenever it matters.
schema: apparatus/profile@v0
status: unconfigured        # legacy setup metadata; either status is usable
privacy_mode: standard      # legacy default; the task Memory decision takes precedence
work_types: []              # e.g. analysis, quality, project-management, writing, support
review_day: null            # optional preference for a requested review; never a schedule
spend: balanced             # model capability and cost: frugal, balanced, or thorough
features:                   # optional core features; omitted means all are on
  library_indexing: true    # extract, index, and recall Library sources
  snapshots: true           # save and restore workspace snapshots
  ignore_rules: true        # apply System/ignore; built-in OS-noise defaults always apply
key_people: []              # name required; role and organization optional
current_efforts: []         # title required; done_when and next_action optional
source_locations: []        # plain-language places where source documents live
