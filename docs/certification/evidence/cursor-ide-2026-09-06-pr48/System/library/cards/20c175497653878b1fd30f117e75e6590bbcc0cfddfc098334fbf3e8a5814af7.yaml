summary: A practical guide for preparing, facilitating, and following up on a two-session
  workshop with 12 places per session and a water break after 45 minutes. It provides
  reusable checklists and a session flow while clearly leaving the venue, purpose,
  audience, schedule, staffing, agenda, materials, registration, communications, and
  accessibility arrangements to be confirmed.
