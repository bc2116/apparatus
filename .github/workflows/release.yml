name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      sdist_name: ${{ steps.packages.outputs.sdist_name }}
      wheel_name: ${{ steps.packages.outputs.wheel_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Check release version and mode
        id: release
        env:
          APPARATUS_RELEASE_MODE: ${{ vars.APPARATUS_RELEASE_MODE }}
        shell: python
        run: |
          import os
          import re
          from datetime import date
          from pathlib import Path

          event = os.environ["GITHUB_EVENT_NAME"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          version_text = Path("packages/apparatus-core/pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "([^"]+)"$', version_text)
          if match is None:
              raise SystemExit("packages/apparatus-core/pyproject.toml has no project version")
          version = match.group(1)
          if event == "push" and ref_name != f"v{version}":
              raise SystemExit(
                  f"release tag {ref_name!r} must exactly match package version v{version}"
              )

          Path("dist").mkdir(exist_ok=True)
          dry_run = event == "workflow_dispatch" or os.environ.get("APPARATUS_RELEASE_MODE") != "publish"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"dry_run={str(dry_run).lower()}\n")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## v{version}"
          section = re.search(
              rf"^{re.escape(heading)}[ \t]*$"
              rf"(?P<body>.*?)(?=^## [^\n]+$|\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if section is not None:
              notes = (heading + section.group("body")).strip()
          else:
              notes = (
                  f"## v{version}\n\n"
                  f"Release date: {date.today().isoformat()}\n\n"
                  "Included files: universal payload archive, apparatus-core source distribution, "
                  "and apparatus-core wheel.\n\n"
                  "Update CHANGELOG.md with release notes before the next release."
              )
          if dry_run:
              notes = "# Dry-run release — not published to PyPI\n\n" + notes
          Path("dist/release-notes.md").write_text(notes + "\n", encoding="utf-8")
      - name: Build universal payload
        run: uv run python tools/build_payload.py
      - name: Build apparatus-core distribution
        run: uv build --package apparatus-core --out-dir dist/packages
      - name: Resolve apparatus-core distribution files
        id: packages
        shell: python
        run: |
          import os
          import re
          import stat
          from pathlib import Path

          package_dir = Path("dist/packages")
          try:
              package_dir_stat = package_dir.stat(follow_symlinks=False)
          except OSError as error:
              raise SystemExit(f"cannot inspect dist/packages: {error}") from error
          reparse_flag = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0)
          if (
              not stat.S_ISDIR(package_dir_stat.st_mode)
              or getattr(package_dir_stat, "st_file_attributes", 0) & reparse_flag
          ):
              raise SystemExit("dist/packages must be a real directory")
          entries = sorted(package_dir.iterdir())
          try:
              entry_stats = {
                  entry: entry.stat(follow_symlinks=False) for entry in entries
              }
          except OSError as error:
              raise SystemExit(f"cannot inspect a distribution entry: {error}") from error
          if any(
              not stat.S_ISREG(entry_stat.st_mode)
              or getattr(entry_stat, "st_file_attributes", 0) & reparse_flag
              for entry_stat in entry_stats.values()
          ):
              raise SystemExit("dist/packages may contain only regular distribution files")
          sdist_pattern = re.compile(r"apparatus_core-[A-Za-z0-9][A-Za-z0-9._+]*\.tar\.gz")
          wheel_pattern = re.compile(
              r"apparatus_core-[A-Za-z0-9][A-Za-z0-9._+]*"
              r"-[A-Za-z0-9_.]+-[A-Za-z0-9_.]+-[A-Za-z0-9_.]+\.whl"
          )
          sdists = [entry for entry in entries if sdist_pattern.fullmatch(entry.name)]
          wheels = [entry for entry in entries if wheel_pattern.fullmatch(entry.name)]
          metadata = [entry for entry in entries if entry.name == ".gitignore"]
          recognized = {*sdists, *wheels, *metadata}
          if len(recognized) != len(entries):
              raise SystemExit("dist/packages contains an unexpected entry")
          if metadata and metadata[0].read_bytes() != b"*":
              raise SystemExit("dist/packages/.gitignore has unexpected content")
          if len(sdists) != 1 or len(wheels) != 1:
              raise SystemExit(
                  "apparatus-core build must produce exactly one sdist and one wheel"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"sdist_name={sdists[0].name}\n")
              output.write(f"wheel_name={wheels[0].name}\n")
      - name: Stage normalized release files
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SDIST_NAME: ${{ steps.packages.outputs.sdist_name }}
          WHEEL_NAME: ${{ steps.packages.outputs.wheel_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-files/packages dist/release-files/installer/windows dist/release-files/installer/macos
          cp "dist/apparatus-payload-${VERSION}.zip" dist/release-files/
          cp "dist/packages/${SDIST_NAME}" dist/release-files/packages/
          cp "dist/packages/${WHEEL_NAME}" dist/release-files/packages/
          cp dist/release-notes.md dist/release-files/
          cp installer/windows/bootstrap-apparatus.ps1 dist/release-files/installer/windows/
          cp installer/macos/bootstrap-apparatus.sh dist/release-files/installer/macos/
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apparatus-release-inputs-${{ steps.release.outputs.version }}
          if-no-files-found: error
          path: dist/release-files

  build-windows-installer:
    name: Build Windows installer wrapper
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Inno Setup
        shell: pwsh
        env:
          INNO_SETUP_VERSION: '7.0.2'
          INNO_SETUP_SHA256: 2b8734490a83f1ed074022b85d46c5ce9c3e2fbe9b63a45c28a74b478ac3a94f
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION-x86.exe"
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_SETUP_VERSION.Replace('.', '_'))/innosetup-$env:INNO_SETUP_VERSION-x86.exe"
          Invoke-WebRequest -Uri $uri -OutFile $download
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:INNO_SETUP_SHA256) {
            throw "Pinned Inno Setup download hash mismatch: $actual"
          }
          $signature = Get-AuthenticodeSignature -FilePath $download
          if ($signature.Status -ne 'Valid') {
            throw "Pinned Inno Setup signature status was $($signature.Status)."
          }
          if ($signature.SignerCertificate.Subject -notmatch '(^|, )CN=Pyrsys B\.V\.(,|$)') {
            throw 'Pinned Inno Setup does not have the expected publisher signature.'
          }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $process = Start-Process -FilePath $download -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDirectory"
          )
          if ($process.ExitCode -ne 0) {
            throw "Pinned Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $compiler = Join-Path $installDirectory 'ISCC.exe'
          $compilerBanner = (& $compiler '/?' 2>&1 | Out-String)
          $compilerHelpExitCode = $LASTEXITCODE
          Write-Output $compilerBanner
          if ($compilerHelpExitCode -ne 1) {
            throw "Pinned Inno Setup compiler help returned unexpected exit code $compilerHelpExitCode."
          }
          if ($compilerBanner -notmatch 'Inno Setup 7 \(32-bit\) Command-Line Compiler') {
            throw 'Pinned Inno Setup compiler did not report the expected major version and architecture.'
          }
          $global:LASTEXITCODE = 0
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build Windows installer
        shell: powershell
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          .\installer\windows\build-installer.ps1 `
            -Compiler $env:INNO_COMPILER `
            -OutputDirectory dist\windows `
            -Version $env:VERSION
      - name: Exercise wrapped Windows dry-run
        shell: pwsh
        run: |
          function Invoke-ApparatusInstaller([string[]] $Arguments) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = (Resolve-Path '.\dist\windows\apparatus-installer.exe').Path
            $startInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) {
              [void] $startInfo.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $process.WaitForExit()
            return $process.ExitCode
          }

          $log = Join-Path $env:RUNNER_TEMP 'apparatus-installer.log'
          $installerExit = Invoke-ApparatusInstaller -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DRYRUN', "/LOG=$log"
          )
          if ($installerExit -ne 0) {
            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log
            }
            throw "Wrapped Windows dry-run failed with exit code $installerExit."
          }
          if (-not (Test-Path -LiteralPath $log)) {
            throw 'The Windows wrapper did not create its requested verification log.'
          }
          $logText = Get-Content -LiteralPath $log -Raw
          if ($logText -notmatch 'Embedded bootstrap SHA-256 verified\.') {
            throw 'The Windows wrapper log did not record embedded-script verification.'
          }
          if ($logText -notmatch 'Apparatus setup dry-run') {
            throw 'The Windows wrapper log did not record the bootstrap dry-run.'
          }

          $marker = Join-Path $env:RUNNER_TEMP 'apparatus-injection-marker'
          $hostilePath = "C:\Runner Temp\Apparatus & New-Item '$marker'; trailing\"
          $hostileExit = Invoke-ApparatusInstaller -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DRYRUN',
            "/WORKSPACEPATH=$hostilePath", "/LOG=$log"
          )
          if ($hostileExit -ne 0 -or (Test-Path -LiteralPath $marker)) {
            throw 'The Windows wrapper did not preserve a hostile workspace path as one value.'
          }

          $reverseLog = Join-Path $env:RUNNER_TEMP 'apparatus-installer-reverse.log'
          $reverseExit = Invoke-ApparatusInstaller -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/WORKSPACEPATH=$hostilePath", '/DRYRUN', "/LOG=$reverseLog"
          )
          if ($reverseExit -ne 0 -or (Test-Path -LiteralPath $marker)) {
            throw 'The Windows wrapper changed behavior when workspace path preceded dry-run.'
          }
          $reverseText = Get-Content -LiteralPath $reverseLog -Raw
          if ($reverseText -notmatch 'Apparatus setup dry-run' -or $reverseText -notmatch 'trailing\\') {
            throw 'The Windows wrapper lost a reordered option or trailing backslash.'
          }

          $duplicateExit = Invoke-ApparatusInstaller -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DRYRUN', '/DRYRUN'
          )
          if ($duplicateExit -eq 0) {
            throw 'The Windows wrapper accepted a duplicate dry-run option.'
          }
          $unknownExit = Invoke-ApparatusInstaller -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOTANOPTION'
          )
          if ($unknownExit -eq 0) {
            throw 'The Windows wrapper accepted an unknown option.'
          }

          $unsafeTarget = Join-Path $env:USERPROFILE 'OneDrive\Apparatus'
          $unsafeExit = Invoke-ApparatusInstaller -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/WORKSPACEPATH=$unsafeTarget", "/LOG=$log"
          )
          if ($unsafeExit -eq 0) {
            throw 'The Windows wrapper masked the bootstrap refusal of an unsafe target.'
          }
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apparatus-unsigned-windows-installer-${{ needs.build.outputs.version }}
          if-no-files-found: error
          path: dist/windows/apparatus-installer.exe

  build-macos-installer:
    name: Build macOS installer wrapper
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and verify macOS installer
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sw_vers
          shasum -a 256 /usr/bin/pkgbuild /usr/bin/productbuild
          installer/macos/build-package.sh \
            --output dist/macos/apparatus-installer.pkg \
            --version "$VERSION"
          /usr/bin/env -u BASH_ENV -u ENV /bin/bash \
            installer/macos/bootstrap-apparatus.sh --dry-run
      - name: Exercise packaged dispatcher fail-closed path
        run: |
          set -euo pipefail
          probe_directory="$RUNNER_TEMP/apparatus-dispatcher-probe"
          mkdir "$probe_directory"
          probe="$probe_directory/postinstall"
          cp installer/macos/bootstrap-apparatus.sh "$probe_directory/bootstrap-apparatus.sh"
          chmod 0755 "$probe_directory/bootstrap-apparatus.sh"
          /usr/bin/sed \
            "s|console_user=\$(/usr/bin/stat -f '%Su' /dev/console)|console_user=loginwindow|" \
            installer/macos/package-scripts/postinstall > "$probe"
          chmod 0755 "$probe"
          set +e
          output=$(sudo "$probe" 2>&1)
          status=$?
          set -e
          [[ $status -ne 0 ]]
          [[ $output == *'Sign in to a user account before running this package.'* ]]
          [[ $output == *'Re-running is safe.'* ]]
          [[ $output != *'Apparatus setup dry-run'* ]]
      - name: Exercise packaged dispatcher identity drop
        run: |
          set -euo pipefail
          probe_directory="$RUNNER_TEMP/apparatus-dispatcher-positive"
          mkdir "$probe_directory"
          probe="$probe_directory/postinstall"
          runner_user=$(id -un)
          runner_uid=$(id -u)
          runner_home=$HOME
          /usr/bin/sed \
            "s|console_user=\$(/usr/bin/stat -f '%Su' /dev/console)|console_user='$runner_user'|" \
            installer/macos/package-scripts/postinstall > "$probe"
          chmod 0755 "$probe"
          canary="$probe_directory/bootstrap-apparatus.sh"
          printf '%s\n' \
            '#!/bin/bash' \
            'printf "canary-uid=%s\n" "$(/usr/bin/id -u)"' \
            'printf "canary-home=%s\n" "$HOME"' \
            'printf "canary-user=%s\n" "$USER"' \
            'printf "canary-logname=%s\n" "$LOGNAME"' \
            'printf "canary-path=%s\n" "$PATH"' > "$canary"
          chmod 0755 "$canary"
          output=$(sudo "$probe" 2>&1)
          [[ $runner_uid -gt 0 ]]
          [[ $output == *"canary-uid=$runner_uid"* ]]
          [[ $output == *"canary-home=$runner_home"* ]]
          [[ $output == *"canary-user=$runner_user"* ]]
          [[ $output == *"canary-logname=$runner_user"* ]]
          [[ $output == *'canary-path=/usr/bin:/bin:/usr/sbin:/sbin'* ]]
          [[ $output != *'canary-uid=0'* ]]
      - name: Upload unsigned macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apparatus-unsigned-macos-installer-${{ needs.build.outputs.version }}
          if-no-files-found: error
          path: dist/macos/apparatus-installer.pkg

  sign-windows-installer:
    name: Sign Windows installer
    needs: [build, build-windows-installer]
    if: >-
      needs.build.result == 'success' &&
      needs.build-windows-installer.result == 'success' &&
      vars.APPARATUS_SIGN_WINDOWS == 'enabled'
    # Routing happens before an environment is opened, so these fixed labels
    # are repository-level configuration rather than environment variables.
    runs-on: [self-hosted, Windows, X64, apparatus-signing-windows]
    environment: signing
    permissions:
      contents: read
    steps:
      - name: Download unsigned Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-unsigned-windows-installer-${{ needs.build.outputs.version }}
          path: unsigned-windows
      - name: Verify signing-runner configuration
        shell: pwsh
        env:
          # OPERATOR: protected `signing` environment metadata; never key material.
          APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          # OPERATOR: exact publisher subject approved during certificate enrollment.
          APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT: ${{ vars.APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT }}
          # OPERATOR: RFC 3161 endpoint approved by the certificate provider.
          APPARATUS_WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.APPARATUS_WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          foreach ($name in @(
            'APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT',
            'APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT',
            'APPARATUS_WINDOWS_SIGNING_TIMESTAMP_URL'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Set $name on the protected signing environment."
            }
          }
          if ($env:APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -cnotmatch '^[A-F0-9]{40}$') {
            throw 'The signing certificate thumbprint must be exactly 40 uppercase hexadecimal characters.'
          }
      - name: Resolve trusted signtool, validate the certificate, and sign
        shell: pwsh
        env:
          # OPERATOR: protected `signing` environment metadata; never key material.
          APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          # OPERATOR: exact publisher subject approved during certificate enrollment.
          APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT: ${{ vars.APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT }}
          # OPERATOR: RFC 3161 endpoint approved by the certificate provider.
          APPARATUS_WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.APPARATUS_WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkBin = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $versionDirectories = @(
            Get-ChildItem -LiteralPath $sdkBin -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending
          )
          $candidates = @(
            $versionDirectories |
              ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          )
          if ($candidates.Count -eq 0) {
            throw "No x64 Windows SDK signtool exists below $sdkBin."
          }
          $signTool = Get-Item -LiteralPath $candidates[0]
          $trustedPrefix = $sdkBin.TrimEnd('\') + '\'
          if (-not $signTool.FullName.StartsWith(
            $trustedPrefix,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'Resolved signtool escaped the trusted Windows SDK directory.'
          }
          $toolSignature = Get-AuthenticodeSignature -FilePath $signTool.FullName
          if ($toolSignature.Status -ne 'Valid') {
            throw "Windows SDK signtool signature status was $($toolSignature.Status)."
          }
          # OPERATOR: provision this dedicated runner's CurrentUser store with
          # the enrolled hardware- or cloud-KSP-backed certificate.
          $matches = @(
            Get-ChildItem 'Cert:\CurrentUser\My' |
              Where-Object {
                $_.Thumbprint -ceq $env:APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT
              }
          )
          if ($matches.Count -ne 1) {
            throw 'Exactly one CurrentUser certificate must match the configured thumbprint.'
          }
          $certificate = $matches[0]
          if ($certificate.Subject -cne $env:APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT) {
            throw 'The signing certificate subject does not exactly match the protected configuration.'
          }
          $now = [DateTime]::UtcNow
          if (
            $certificate.NotBefore.ToUniversalTime() -gt $now -or
            $certificate.NotAfter.ToUniversalTime() -lt $now
          ) {
            throw 'The signing certificate is outside its validity window.'
          }
          $ekuExtensions = @(
            $certificate.Extensions |
              Where-Object { $_.Oid.Value -eq '2.5.29.37' }
          )
          if ($ekuExtensions.Count -ne 1) {
            throw 'The signing certificate must have one Enhanced Key Usage extension.'
          }
          $codeSigningEkus = @(
            $ekuExtensions[0].EnhancedKeyUsages |
              Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }
          )
          if ($codeSigningEkus.Count -ne 1) {
            throw 'The signing certificate lacks the Code Signing EKU.'
          }
          if (-not $certificate.HasPrivateKey) {
            throw 'The signing certificate has no accessible private key.'
          }
          $privateKey = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($certificate)
          if ($null -eq $privateKey) {
            $privateKey = [System.Security.Cryptography.X509Certificates.ECDsaCertificateExtensions]::GetECDsaPrivateKey($certificate)
          }
          if ($null -eq $privateKey) {
            throw 'The signing certificate private-key handle cannot be opened.'
          }
          $privateKey.Dispose()
          & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 `
            /tr $env:APPARATUS_WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 `
            'unsigned-windows/apparatus-installer.exe'
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }
      - name: Verify Windows signature
        shell: pwsh
        env:
          # OPERATOR: compare the output to the protected enrollment metadata.
          APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
          # OPERATOR: compare the output to the protected enrollment metadata.
          APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT: ${{ vars.APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT }}
        run: |
          $signature = Get-AuthenticodeSignature `
            -FilePath 'unsigned-windows/apparatus-installer.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode signature status was $($signature.Status)."
          }
          if (
            $signature.SignerCertificate.Thumbprint -cne $env:APPARATUS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -or
            $signature.SignerCertificate.Subject -cne $env:APPARATUS_WINDOWS_SIGNING_CERTIFICATE_SUBJECT
          ) {
            throw 'The signed installer does not use the exactly configured certificate.'
          }
      - name: Exercise signed Windows installer dry-run
        shell: pwsh
        run: |
          function Invoke-ApparatusInstaller([string[]] $Arguments) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = (Resolve-Path '.\unsigned-windows\apparatus-installer.exe').Path
            $startInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) {
              [void] $startInfo.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $process.WaitForExit()
            return $process.ExitCode
          }

          $log = Join-Path $env:RUNNER_TEMP 'apparatus-signed-installer.log'
          $installerExit = Invoke-ApparatusInstaller -Arguments @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DRYRUN', "/LOG=$log"
          )
          if ($installerExit -ne 0) {
            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log
            }
            throw "Signed Windows installer dry-run failed with exit code $installerExit."
          }
          if (-not (Test-Path -LiteralPath $log)) {
            throw 'The signed Windows installer did not create its requested verification log.'
          }
          $logText = Get-Content -LiteralPath $log -Raw
          if (
            $logText -notmatch 'Embedded bootstrap SHA-256 verified\.' -or
            $logText -notmatch 'Apparatus setup dry-run'
          ) {
            throw 'The signed Windows installer did not verify and run its embedded bootstrap.'
          }
      - name: Upload signed Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apparatus-signed-windows-installer-${{ needs.build.outputs.version }}
          if-no-files-found: error
          path: unsigned-windows/apparatus-installer.exe

  sign-macos-installer:
    name: Sign and notarize macOS installer
    needs: [build, build-macos-installer]
    if: >-
      needs.build.result == 'success' &&
      needs.build-macos-installer.result == 'success' &&
      vars.APPARATUS_SIGN_MACOS == 'enabled'
    runs-on: macos-15
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download unsigned macOS installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-unsigned-macos-installer-${{ needs.build.outputs.version }}
          path: unsigned-macos
      - name: Sign, notarize, and staple installer package
        shell: bash
        env:
          # OPERATOR: protected `signing` environment values; never repository content.
          APPARATUS_MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPARATUS_MACOS_SIGNING_CERTIFICATE_BASE64 }}
          APPARATUS_MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPARATUS_MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPARATUS_MACOS_SIGNING_IDENTITY: ${{ secrets.APPARATUS_MACOS_SIGNING_IDENTITY }}
          APPARATUS_MACOS_NOTARY_APPLE_ID: ${{ secrets.APPARATUS_MACOS_NOTARY_APPLE_ID }}
          APPARATUS_MACOS_NOTARY_TEAM_ID: ${{ secrets.APPARATUS_MACOS_NOTARY_TEAM_ID }}
          APPARATUS_MACOS_NOTARY_APP_PASSWORD: ${{ secrets.APPARATUS_MACOS_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          package_path='unsigned-macos/apparatus-installer.pkg'
          for name in \
            APPARATUS_MACOS_SIGNING_CERTIFICATE_BASE64 \
            APPARATUS_MACOS_SIGNING_CERTIFICATE_PASSWORD \
            APPARATUS_MACOS_SIGNING_IDENTITY \
            APPARATUS_MACOS_NOTARY_APPLE_ID \
            APPARATUS_MACOS_NOTARY_TEAM_ID \
            APPARATUS_MACOS_NOTARY_APP_PASSWORD; do
            [[ -n ${!name:-} ]] || { echo "Set $name on the protected signing environment." >&2; exit 1; }
          done
          certificate_path="$RUNNER_TEMP/apparatus-signing.p12"
          keychain_path="$RUNNER_TEMP/apparatus-signing.keychain-db"
          trap 'rm -f "$certificate_path"; security delete-keychain "$keychain_path" || true' EXIT
          printf '%s' "$APPARATUS_MACOS_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$APPARATUS_MACOS_SIGNING_CERTIFICATE_PASSWORD" "$keychain_path"
          security unlock-keychain -p "$APPARATUS_MACOS_SIGNING_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPARATUS_MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$APPARATUS_MACOS_SIGNING_CERTIFICATE_PASSWORD" "$keychain_path"
          productsign --keychain "$keychain_path" --sign "$APPARATUS_MACOS_SIGNING_IDENTITY" \
            "$package_path" "$package_path.signed"
          mv "$package_path.signed" "$package_path"
          xcrun notarytool store-credentials apparatus-notary \
            --keychain "$keychain_path" \
            --apple-id "$APPARATUS_MACOS_NOTARY_APPLE_ID" \
            --team-id "$APPARATUS_MACOS_NOTARY_TEAM_ID" \
            --password "$APPARATUS_MACOS_NOTARY_APP_PASSWORD"
          xcrun notarytool submit "$package_path" --keychain "$keychain_path" \
            --keychain-profile apparatus-notary --wait
          xcrun stapler staple "$package_path"
          pkgutil --check-signature "$package_path"
          spctl --assess --type install --verbose=2 "$package_path"
          xcrun stapler validate "$package_path"
      - name: Re-verify signed macOS package payload
        run: installer/macos/verify-package.sh unsigned-macos/apparatus-installer.pkg
      - name: Upload signed macOS installer package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apparatus-signed-macos-installer-${{ needs.build.outputs.version }}
          if-no-files-found: error
          path: unsigned-macos/apparatus-installer.pkg

  assemble-release:
    name: Assemble release files and checksums
    needs: [build, build-windows-installer, build-macos-installer, sign-windows-installer, sign-macos-installer]
    if: >-
      always() && needs.build.result == 'success' &&
      needs.build-windows-installer.result == 'success' &&
      needs.build-macos-installer.result == 'success' &&
      (needs.sign-windows-installer.result == 'success' || needs.sign-windows-installer.result == 'skipped') &&
      (needs.sign-macos-installer.result == 'success' || needs.sign-macos-installer.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-release-inputs-${{ needs.build.outputs.version }}
          path: release-inputs
      - name: Download unsigned Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-unsigned-windows-installer-${{ needs.build.outputs.version }}
          path: unsigned-windows
      - name: Download unsigned macOS installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-unsigned-macos-installer-${{ needs.build.outputs.version }}
          path: unsigned-macos
      - name: Normalize release inputs
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          mkdir final-release
          cp "release-inputs/apparatus-payload-${VERSION}.zip" final-release/
          cp "release-inputs/packages/${SDIST_NAME}" final-release/
          cp "release-inputs/packages/${WHEEL_NAME}" final-release/
          cp release-inputs/release-notes.md final-release/
          cp release-inputs/installer/windows/bootstrap-apparatus.ps1 final-release/
          cp release-inputs/installer/macos/bootstrap-apparatus.sh final-release/
          cp unsigned-windows/apparatus-installer.exe final-release/
          cp unsigned-macos/apparatus-installer.pkg final-release/
      - name: Download signed Windows installer
        if: needs.sign-windows-installer.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-signed-windows-installer-${{ needs.build.outputs.version }}
          path: signed-windows
      - name: Install signed Windows installer
        if: needs.sign-windows-installer.result == 'success'
        run: cp signed-windows/apparatus-installer.exe final-release/apparatus-installer.exe
      - name: Download signed macOS installer
        if: needs.sign-macos-installer.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-signed-macos-installer-${{ needs.build.outputs.version }}
          path: signed-macos
      - name: Install signed macOS installer package
        if: needs.sign-macos-installer.result == 'success'
        run: cp signed-macos/apparatus-installer.pkg final-release/apparatus-installer.pkg
      - name: Generate SHA256SUMS
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          cd final-release
          release_files=(
            "apparatus-payload-${VERSION}.zip" \
            "${SDIST_NAME}" \
            "${WHEEL_NAME}" \
            "bootstrap-apparatus.ps1" \
            "bootstrap-apparatus.sh" \
            "apparatus-installer.exe" \
            "apparatus-installer.pkg"
          )
          shasum -a 256 "${release_files[@]}" > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Upload final release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apparatus-release-${{ needs.build.outputs.version }}
          if-no-files-found: error
          path: final-release

  publish-pypi:
    name: Publish apparatus-core to PyPI
    needs: [build, assemble-release]
    if: >-
      github.event_name == 'push' &&
      needs.build.outputs.dry_run == 'false' &&
      needs.assemble-release.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-release-${{ needs.build.outputs.version }}
          path: release-files
      - name: Stage only Python distributions
        env:
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          mkdir python-packages
          cp "release-files/${SDIST_NAME}" python-packages/
          cp "release-files/${WHEEL_NAME}" python-packages/
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-packages

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi, assemble-release]
    if: >-
      always() && github.event_name == 'push' &&
      needs.build.result == 'success' &&
      needs.assemble-release.result == 'success' &&
      (needs.build.outputs.dry_run == 'true' || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apparatus-release-${{ needs.build.outputs.version }}
          path: release-files
      - name: Create release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$DRY_RUN" == "true" ]]; then
            prerelease=(--prerelease)
          fi
          release_files=(
            "release-files/apparatus-payload-${VERSION}.zip"
            "release-files/${SDIST_NAME}"
            "release-files/${WHEEL_NAME}"
            "release-files/bootstrap-apparatus.ps1"
            "release-files/bootstrap-apparatus.sh"
            "release-files/apparatus-installer.exe"
            "release-files/apparatus-installer.pkg"
            "release-files/SHA256SUMS"
          )
          gh release create "v${VERSION}" \
            --repo "$GH_REPO" \
            --title "v${VERSION}" \
            --notes-file "release-files/release-notes.md" \
            "${prerelease[@]}" \
            "${release_files[@]}"
