[project]
name = "apparatus-core"
version = "0.0.1"
description = "Core protocol, validators, and CLI for Apparatus — the governed workspace for agentic knowledge work."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bryan Conn", email = "bc2116@gmail.com" }]
# PyYAML is the one dependency the state format demands (ADR-0002): YAML
# frontmatter and profile.yaml, read strictly via yaml.safe_load.
dependencies = ["pyyaml>=6.0"]

[project.scripts]
apparatus = "apparatus_core.cli:main"
ap = "apparatus_core.cli:main"

[project.entry-points."apparatus.commands"]
check = "apparatus_core.commands.check:register"
doctor = "apparatus_core.commands.doctor:register"

[project.urls]
Repository = "https://github.com/bc2116/apparatus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apparatus_core"]
