[project]
name = "apparatus-mailbox-survey"
version = "0.1.3"
description = "Portable Mailbox Survey Skill and read-only report validator."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
lifecycle = ["apparatus-core>=0.0.2,<0.1"]

[tool.uv.sources]
apparatus-core = { workspace = true }

[project.scripts]
apparatus-mailbox-survey = "apparatus_mailbox_survey.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apparatus_mailbox_survey"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml", "src/apparatus_mailbox_survey"]
