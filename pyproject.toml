[project]
name = "apparatus-monorepo"
version = "0.0.0"
description = "Workspace root for the Apparatus monorepo (not a distributable package)."
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["conformance", "packages"]
addopts = "-q"
